[package]
name = "oar-ocr"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = "2.0.0-rc.10"
image = "0.25"
ndarray = "0.16"
thiserror = "1.0"
rayon = "1.10"
log = "0.4"
env_logger = "0.10"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

[lib]
name = "oar_ocr"
path = "src/lib.rs"
